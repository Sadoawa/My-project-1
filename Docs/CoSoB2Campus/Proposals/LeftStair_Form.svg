<text x="820" y="413" font-size="16">Vế đầu hướng về bãi xe / dãy giữa →</text>
<text x="810" y="458" font-size="17">• Bậc đá xám, mép bậc rõ.</text>
<text x="810" y="491" font-size="17">• Bản thang mỏng theo độ dốc.</text>
<text x="810" y="524" font-size="17">• Lan can đen, thanh đứng mảnh.</text>
<text x="810" y="557" font-size="17">• Có tay vịn ở mép ngoài và khe giữa.</text>
<text x="810" y="600" font-size="15" fill="#657789">Không còn khối hộp lớn dưới vế trên.</text>
<rect x="42" y="670" width="1113" height="111" rx="10" fill="#e5edf3"/>
<text x="65" y="704" font-size="18" font-weight="bold">Dự kiến để dựng: bản thang dày khoảng 15–18 cm, lan can cao khoảng 1 m.</text>
<text x="65" y="736" font-size="17">Kích thước là ước lượng; đây là phác hình dáng, không phải bản vẽ kết cấu hay bản vẽ thi công.</text>
<text x="65" y="763" font-size="17">Lối xe ra vẫn nằm bên cạnh cầu thang và được chừa thông như phương án đã chốt.</text>
